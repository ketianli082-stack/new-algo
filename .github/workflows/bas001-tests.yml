name: BAS-001 成本核算测试

on:
  push:
    paths:
      - 'tools/**'
      - 'tests/**'
      - '.github/workflows/bas001-tests.yml'
  pull_request:
    paths:
      - 'tools/**'
      - 'tests/**'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 运行 BAS-001 单元测试
        run: python -m unittest discover -s tests -v
      - name: 检查示例输出
        run: python -m tools.bas001_cost_model config/bas001_cost_example.json
