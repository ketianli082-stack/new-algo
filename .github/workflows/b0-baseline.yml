name: B0 A16 baseline reproduction
on:
  push:
    branches: [lkt]
    paths: ['.github/workflows/b0-baseline.yml']
  workflow_dispatch:
    inputs:
      window:
        type: choice
        description: backtest window
        required: true
        default: 2024-2025
        options:
          - 2024-2025
permissions:
  contents: read
concurrency:
  group: algogene-cloud
  cancel-in-progress: false
jobs:
  b0:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify syntax
        run: python -m compileall -q strategy tools tests
      - name: Run B0 exact A16 backtest
        env:
          ALGOGENE_USER_ID: ${{ secrets.ALGOGENE_USER_ID }}
          ALGOGENE_API_KEY: ${{ secrets.ALGOGENE_API_KEY }}
        run: python -u tools/b0_algogene_run.py --window "${{ inputs.window || '2024-2025' }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b0-${{ github.run_id }}
          path: outputs/b0/
