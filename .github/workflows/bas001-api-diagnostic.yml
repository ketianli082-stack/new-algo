name: BAS-001 ALGOGENE API 只读诊断
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bas001-api-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bas001-algogene-cloud
  cancel-in-progress: false

jobs:
  api-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 仅查询任务状态以验证凭证和 HTTP 状态
        env:
          ALGOGENE_USER_ID: ${{ secrets.ALGOGENE_USER_ID }}
          ALGOGENE_API_KEY: ${{ secrets.ALGOGENE_API_KEY }}
        run: python -u tools/algogene_api_diagnostic.py
      - name: 上传脱敏诊断报告（无原始响应或密钥）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bas001-api-diagnostic-${{ github.run_id }}
          path: outputs/bas001/api-diagnostic.json
          if-no-files-found: warn
          retention-days: 14
