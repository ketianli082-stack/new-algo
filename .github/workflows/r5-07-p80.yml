name: R5-07 P80 portfolio exposure
on:
  push:
    branches: [lkt]
    paths: ['.github/workflows/r5-07-p80.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: algogene-cloud
  cancel-in-progress: false
jobs:
  p80:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify syntax
        run: python -m py_compile tools/r5_07_p80_run.py
      - name: Run portfolio cap 80 percent backtest
        env:
          ALGOGENE_USER_ID: ${{ secrets.ALGOGENE_USER_ID }}
          ALGOGENE_API_KEY: ${{ secrets.ALGOGENE_API_KEY }}
        run: python -u tools/r5_07_p80_run.py --window 2024-2025
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r5-07-p80-${{ github.run_id }}
          path: outputs/r5_07_p80/
