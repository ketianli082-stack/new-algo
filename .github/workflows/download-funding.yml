name: V8 research 下载历史 Funding（手动）
on:
  workflow_dispatch:
jobs:
  funding:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 获取 BTC ETH 逐次资金费数据
        run: |
          python -m tools.download_historical_funding \
            --symbols BTCUSDT ETHUSDT \
            --start '2021-01-01T00:00:00+00:00' \
            --end '2026-01-01T00:00:00+00:00' \
            --output data/binance_usdm_funding_2021_2025.csv
      - name: 文件校验与统计
        run: |
          python -m tools.validate_funding_history \
            data/binance_usdm_funding_2021_2025.csv \
            --symbols BTCUSDT ETHUSDT \
            --start '2021-01-01T00:00:00+00:00' \
            --end '2026-01-01T00:00:00+00:00'
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: research-binance-usdm-funding-2021-2025
          path: data/binance_usdm_funding_2021_2025.csv
          retention-days: 30
