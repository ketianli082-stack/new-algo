name: A16-A17 de-leverage and leg-lag controls (stageA products)
on:
  workflow_dispatch:
    inputs:
      window:
        type: choice
        description: backtest window
        required: true
        default: 2024-2025
permissions:
  contents: read
concurrency:
  group: algogene-cloud
  cancel-in-progress: false
jobs:
  a16:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify syntax
        run: python -m compileall -q strategy tools tests
      - name: Run A16 A13 + TOTAL_GROSS_CAP 50% backtest
        env:
          ALGOGENE_USER_ID: ${{ secrets.ALGOGENE_USER_ID }}
          ALGOGENE_API_KEY: ${{ secrets.ALGOGENE_API_KEY }}
        run: python -u tools/a16_algogene_costtp_run.py --window "${{ inputs.window }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: costtp_cap50-${{ github.run_id }}
          path: outputs/a16_costtp_cap50/
  a17:
    needs: a16
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify syntax
        run: python -m compileall -q strategy tools tests
      - name: Run A17 A13 + LEG_LAG 2-bar forced exit backtest
        env:
          ALGOGENE_USER_ID: ${{ secrets.ALGOGENE_USER_ID }}
          ALGOGENE_API_KEY: ${{ secrets.ALGOGENE_API_KEY }}
        run: python -u tools/a17_algogene_costtp_run.py --window "${{ inputs.window }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: costtp_leglag-${{ github.run_id }}
          path: outputs/a17_costtp_leglag/
